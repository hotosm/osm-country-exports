# Template for Tasking Manager project exports, generated by scripts/tm_configs.py.
# Reproduces the tm-extractor category set (github.com/hotosm/tm-extractor) through oex.
#
# The generator fills in per project: dataset_name, boundary.geom, output.s3.folder
# (the project id) and trims `categories` to the project's mapping types. Projects have
# no country code, so the project id is the dataset identity and there is no `iso3`.

# Empty: output.s3.folder carries the whole dataset prefix (hotosm_project_<id>).
key: ""
subnational: true

# Filled in per project from the Tasking Manager project polygon.
boundary:
  geom: null
  buffer_meters: 0

output:
  dir: ${oc.env:OEX_DATA_DIR,.}/output
  formats: [geojson, shp, kml]
  metadata: true
  resume: true
  # One artifact per geometry type, which is what the TM frontend links to.
  split_by_geometry: true
  report:
    enabled: false
  s3:
    enabled: true
    bucket: ${oc.env:OEX_S3_BUCKET}
    prefix: TM
    region: us-east-1
    acl: public-read
    # TM layout: TM/hotosm_project_<id>/<category>/<geometry>/<prefix>_<category>_<geometry>_<format>.zip
    nest_by_category: true
    nest_by_geometry: true
    name_include_source: false

parallel:
  enabled: true
  threads: 2
  memory_gb: 7

hdx:
  push: false

source:
  overture:
    enabled: false
  osm:
    enabled: true
    engine: planet
    cache_dir: ${oc.env:OEX_DATA_DIR,.}/data/osm
    pbf_path: ${oc.env:TM_PBF}
    auto_download_planet: false
    planet_fallback: false
  pcodes:
    enabled: false

categories:
  - name: Buildings
    osm:
      enabled: true
      filter: {building: true}
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['building'] AS building
        - tags['building:levels'] AS building_levels
        - tags['building:materials'] AS building_materials
        - tags['addr:full'] AS addr_full
        - tags['addr:housenumber'] AS addr_housenumber
        - tags['addr:street'] AS addr_street
        - tags['addr:city'] AS addr_city
        - tags['office'] AS office
        - tags['source'] AS source

  - name: Roads
    osm:
      enabled: true
      filter: {highway: true}
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['highway'] AS highway
        - tags['surface'] AS surface
        - tags['smoothness'] AS smoothness
        - tags['width'] AS width
        - tags['lanes'] AS lanes
        - tags['oneway'] AS oneway
        - tags['bridge'] AS bridge
        - tags['layer'] AS layer
        - tags['source'] AS source

  - name: Waterways
    osm:
      enabled: true
      filter:
        waterway: true
        water: true
        natural: [water, wetland, bay]
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['waterway'] AS waterway
        - tags['covered'] AS covered
        - tags['width'] AS width
        - tags['depth'] AS depth
        - tags['layer'] AS layer
        - tags['blockage'] AS blockage
        - tags['tunnel'] AS tunnel
        - tags['natural'] AS natural
        - tags['water'] AS water
        - tags['source'] AS source

  - name: Landuse
    osm:
      enabled: true
      filter: {landuse: true}
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['amenity'] AS amenity
        - tags['landuse'] AS landuse
        - tags['leisure'] AS leisure
