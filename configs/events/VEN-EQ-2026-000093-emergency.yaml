# Event capture: Venezuela M 7.5 Earthquake response (GLIDE EQ-2026-000093-VEN).
# Overture emergency facilities (places theme), Caracas-area box (67.09W-66.65W, 10.28N-10.64N).
# Standalone config: merges over oex bundled defaults, not configs/base.yaml.

iso3: VEN
key: hot_overture
subnational: false
frequency: as needed

boundary:
  geom: '{"type":"Polygon","coordinates":[[[-67.0880140686,10.28249265276],[-66.65405410767,10.28249265276],[-66.65405410767,10.64306414992],[-67.0880140686,10.64306414992],[-67.0880140686,10.28249265276]]]}'
  buffer_meters: 0

output:
  dir: ${oc.env:OEX_DATA_DIR,.}/output
  formats: [gpkg, kml, shp]
  metadata: true
  resume: true
  report:
    enabled: true
  s3:
    enabled: true
    bucket: ${oc.env:OEX_S3_BUCKET}
    prefix: ISO3
    region: us-east-1
    acl: public-read

parallel:
  enabled: true
  threads: 2
  memory_gb: 7

source:
  overture:
    enabled: true
    release: latest
  osm:
    enabled: false
  pcodes:
    enabled: true

hdx:
  push: true
  site: prod
  api_key: ${oc.env:HDX_API_KEY}
  owner_org: ${oc.env:HDX_OWNER_ORG}
  maintainer: ${oc.env:HDX_MAINTAINER}
  user_agent: osm-country-exports/0.1
  methodology: Other
  methodology_other: Open Source Geographic information
  purge_existing_resources: false
  title_template: "{category} - Venezuela Caracas (Overture)"

categories:
  - name: emergency_facilities
    skip_pcodes: false
    hdx:
      title: Emergency Facilities
      notes: |
        Emergency and essential-health facilities for the Caracas area of Venezuela
        (bounding box 67.09W-66.65W, 10.28N-10.64N), captured for the M 7.5 earthquake response.

        Includes hospitals, emergency rooms, medical centres, pharmacies, fire, police, and ambulance/EMS services.

        Sourced from the Overture Maps places theme (Meta, Foursquare, Microsoft, AllThePlaces). This data is not from OpenStreetMap and complements the OSM-based exports.

        Event: M 7.5 Earthquake, west of Caracas.

        - Source: [Overture Maps](https://overturemaps.org/)
        - Part of HOT disaster response exports on HDX by [HOT](https://www.hotosm.org/)
      tags: [earthquake-tsunami, facilities-infrastructure, geodata]
      license: Community Data License Agreement - Permissive 2.0
      license_url: https://docs.overturemaps.org/attribution/
      caveats: |
        Data is sourced directly from Overture places (commercial and crowd sources: Meta, Foursquare, Microsoft); records are not verified and per-feature confidence varies. Verify before operational use and check Overture's usage guidelines.
      dataset_source: Overture Maps (places theme)
    overture:
      enabled: true
      theme: places
      feature_type: place
      select:
        - id
        - names.primary AS name
        - categories.primary AS category
        - confidence
        - phones[1] AS phone
        - websites[1] AS website
        - addresses[1].freeform AS address
        - addresses[1].locality AS locality
        - sources[1].dataset AS source
      where:
        - >-
          categories.primary IN ('hospital','emergency_room','urgent_care_clinic','urgent_care_center',
          'ambulance_and_ems_services','fire_department','fire_protection_service','fire_station',
          'police_department','medical_center','medical_clinic','clinic','doctor',
          'health_department','pharmacy','drugstore','community_health_centre',
          'counseling_and_mental_health')
    osm:
      enabled: false
