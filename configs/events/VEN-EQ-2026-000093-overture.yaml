output:
  dir: ${oc.env:OEX_DATA_DIR,.}/output
  formats:
  - gpkg
  - kml
  - shp
  metadata: true
  resume: false
  report:
    enabled: true
  s3:
    enabled: true
    bucket: ${oc.env:OEX_S3_BUCKET}
    prefix: ISO3
    region: us-east-1
    acl: public-read
parallel:
  enabled: true
  threads: 2
  memory_gb: 7
source:
  overture:
    enabled: true
    release: latest
  osm:
    enabled: false
    engine: geofabrik
    cache_dir: ${oc.env:OEX_DATA_DIR,.}/data/osm
    snapshot: latest
    geofabrik_clip_to_boundary: true
    planet_fallback: true
    pbf_path: ${oc.env:OEX_DATA_DIR,.}/data/osm/planet/planet-latest.osm.pbf
    auto_download_planet: true
    keep_pbf: false
  pcodes:
    enabled: true
    cache_dir: ${oc.env:OEX_DATA_DIR,.}/data/pcodes
    levels:
    - 1
    - 2
    - 3
    - 4
    boundary_resolution: geos
hdx:
  push: true
  site: prod
  api_key: ${oc.env:HDX_API_KEY}
  owner_org: ${oc.env:HDX_OWNER_ORG}
  maintainer: ${oc.env:HDX_MAINTAINER}
  user_agent: osm-country-exports/0.1
  methodology: Other
  methodology_other: Open Source Geographic information
  purge_existing_resources: false
  title_template: '{category} - Venezuela Earthquake Affected Area (Overture)'
categories:
- name: buildings
  skip_pcodes: false
  boundary_resolution: h3_neighbor
  hdx:
    title: Buildings
    notes: 'Building footprints for the area affected by the M 7.5 earthquake in Venezuela, covering the epicentre region together with the Caracas and La Guaira urban areas (bounding box 69.76W-65.78W, 8.70N-11.51N).


      Sourced from Overture Maps (buildings theme: OpenStreetMap, Microsoft, Google, Esri); the machine-derived footprints help fill gaps where OpenStreetMap building coverage near the epicentre is sparse.


      Event: M 7.5 Earthquake, west of Caracas. Disaster source: GDACS, USGS.


      - Source: [Overture Maps](https://overturemaps.org/)

      - Part of HOT disaster response exports on HDX by [HOT](https://www.hotosm.org/)

      '
    tags:
    - earthquake-tsunami
    - facilities-infrastructure
    - geodata
    license: hdx-odc-odbl
    license_url: https://opendatacommons.org/licenses/odbl/1-0/
    caveats: Data is sourced directly from Overture and much of it is AI-generated; please verify Overture's usage guidelines before use.
    dataset_source: Overture Maps (buildings theme)
  overture:
    enabled: true
    theme: buildings
    feature_type: building
    select:
    - id
    - names.primary AS name
    - names.common->>'en' AS name_en
    - class
    - subtype
    - height
    - level
    - num_floors
    - sources[1].dataset AS source
    where: []
  osm:
    enabled: false
- name: emergency_facilities
  skip_pcodes: false
  hdx:
    title: Emergency Facilities
    notes: 'Emergency and essential-health facilities (hospitals, emergency rooms, medical centres, pharmacies, fire, police, and ambulance/EMS services) for the area affected by the M 7.5 earthquake in Venezuela, covering the epicentre region together with the Caracas and La Guaira urban areas (bounding box 69.76W-65.78W, 8.70N-11.51N).


      Sourced from the Overture Maps places theme (Meta, Foursquare, Microsoft, AllThePlaces). This data is not from OpenStreetMap and complements the OSM-based exports.


      Event: M 7.5 Earthquake, west of Caracas.


      - Source: [Overture Maps](https://overturemaps.org/)

      - Part of HOT disaster response exports on HDX by [HOT](https://www.hotosm.org/)

      '
    tags:
    - earthquake-tsunami
    - facilities-infrastructure
    - geodata
    license: Community Data License Agreement - Permissive 2.0
    license_url: https://docs.overturemaps.org/attribution/
    caveats: 'Data is sourced directly from Overture places (commercial and crowd sources: Meta, Foursquare, Microsoft); records are not verified and per-feature confidence varies. Verify before operational use and check Overture''s usage guidelines.'
    dataset_source: Overture Maps (places theme)
  overture:
    enabled: true
    theme: places
    feature_type: place
    select:
    - id
    - names.primary AS name
    - categories.primary AS category
    - confidence
    - phones[1] AS phone
    - websites[1] AS website
    - addresses[1].freeform AS address
    - addresses[1].locality AS locality
    - sources[1].dataset AS source
    where:
    - categories.primary IN ('hospital','emergency_room','urgent_care_clinic','urgent_care_center','ambulance_and_ems_services','fire_department','fire_protection_service','fire_station','police_department','medical_center','medical_clinic','clinic','doctor','health_department','pharmacy','drugstore','community_health_centre','counseling_and_mental_health')
  osm:
    enabled: false
