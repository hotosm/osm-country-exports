# Layers shared by the Nepal flood datasets, referenced through `categories_file:`
# so the flood-extent and corridor exports cannot drift apart.
categories:
  - name: buildings
    skip_pcodes: false
    boundary_resolution: h3_neighbor
    hdx:
      title: Buildings
      summary: Building footprints, from homes to hospitals, schools and places of worship. Standing and destroyed together, split by status.
      notes: |
        Building footprints across the region, from residential homes to hospitals, schools and places of worship. Useful for population estimation, damage assessment, and urban planning.

        Coverage reflects where volunteer mappers have been active. Urban areas are usually well represented, remote areas may be sparse. Cross-check critical decisions with local field knowledge.

        - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative world map
        - Tags: [building](https://wiki.openstreetmap.org/wiki/Key:building)
        - Part of the [exports grid on HDX](https://data.humdata.org/organization/hot/) by [HOT](https://www.hotosm.org/)
      tags: [facilities-infrastructure, geodata]
      license: hdx-odc-odbl
      license_url: https://opendatacommons.org/licenses/odbl/1-0/
      caveats: OpenStreetMap data is crowd sourced and cannot be considered to be exhaustive
      dataset_source: OpenStreetMap contributors
    osm:
      enabled: true
      # Destroyed buildings lose the plain `building` tag, so they are kept here too.
      filter:
        building: true
        destroyed:building: true
        damaged:building: true
        damage:building: true
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['name:en'] AS name_en
        - &status "CASE WHEN len(list_filter(map_keys(tags), k -> starts_with(k, 'destroyed:'))) > 0 THEN 'Destroyed' WHEN len(list_filter(map_keys(tags), k -> starts_with(k, 'damaged:'))) > 0 OR tags['damage:building'] IS NOT NULL THEN 'Damaged' ELSE 'Standing' END AS status"
        - "coalesce(tags['building'], tags['destroyed:building'], tags['damaged:building'], tags['damage:building']) AS building"
        - tags['building:levels'] AS building_levels
        - tags['building:materials'] AS building_materials
        - tags['was:building:levels'] AS was_building_levels
        - tags['damage:type'] AS damage_type
        - tags['end_date'] AS end_date
        - tags['addr:full'] AS addr_full
        - tags['addr:housenumber'] AS addr_housenumber
        - tags['addr:street'] AS addr_street
        - tags['addr:city'] AS addr_city
        - tags['office'] AS office
        - tags['source'] AS source
      where: []
    overture:
      enabled: false
      tiles: false
    temporal:
      column: update_time

    transliterate:
      - target: name_latin
        source: name
        prefer: name_en

  - name: destroyed_features
    formats: [gpkg, shp, geojson, kml]
    hdx:
      title: Destroyed and Damaged Features
      summary: Buildings, roads, bridges, waterways and other features mappers recorded as destroyed or damaged during the response.
      notes: |
        Buildings, roads, bridges, waterways and other features that mappers have recorded as destroyed or damaged during the response. `status` says destroyed or damaged, and `feature_type` says what the feature was.

        These features also appear in the Buildings, Roads and Bridges layers, which carry what is standing and what has been lost together. This layer gathers everything recorded as destroyed or damaged in one place.

        - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative world map
        - Tags: [lifecycle prefix](https://wiki.openstreetmap.org/wiki/Lifecycle_prefix), [damage](https://wiki.openstreetmap.org/wiki/Key:damage)
        - Part of the [exports grid on HDX](https://data.humdata.org/organization/hot/) by [HOT](https://www.hotosm.org/)
      tags: [damage assessment, affected area, flooding, facilities-infrastructure, geodata]
      license: hdx-odc-odbl
      license_url: https://opendatacommons.org/licenses/odbl/1-0/
      caveats: Volunteer damage mapping from imagery, not a verified ground assessment, and cannot be considered exhaustive
      dataset_source: OpenStreetMap contributors
    osm:
      enabled: true
      filter:
        destroyed:building: true
        destroyed:building:part: true
        destroyed:highway: true
        destroyed:bridge: true
        destroyed:tunnel: true
        destroyed:waterway: true
        destroyed:aeroway: true
        destroyed:power: true
        destroyed:amenity: true
        destroyed:shop: true
        destroyed:tourism: true
        destroyed:leisure: true
        destroyed:man_made: true
        destroyed:barrier: true
        destroyed:landuse: true
        destroyed:natural: true
        destroyed:office: true
        destroyed:sport: true
        destroyed:parking: true
        damaged:building: true
        damaged:aeroway: true
        damage:building: true
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['name:en'] AS name_en
        - *status
        - "CASE WHEN tags['destroyed:building'] IS NOT NULL OR tags['damaged:building'] IS NOT NULL OR tags['damage:building'] IS NOT NULL THEN 'building' WHEN tags['destroyed:building:part'] IS NOT NULL THEN 'building part' WHEN tags['destroyed:bridge'] IS NOT NULL THEN 'bridge' WHEN tags['destroyed:tunnel'] IS NOT NULL THEN 'tunnel' WHEN tags['destroyed:highway'] IS NOT NULL THEN 'road' WHEN tags['destroyed:waterway'] IS NOT NULL THEN 'waterway' WHEN tags['destroyed:aeroway'] IS NOT NULL OR tags['damaged:aeroway'] IS NOT NULL THEN 'aeroway' WHEN tags['destroyed:power'] IS NOT NULL THEN 'power' WHEN tags['destroyed:amenity'] IS NOT NULL THEN 'amenity' WHEN tags['destroyed:shop'] IS NOT NULL THEN 'shop' WHEN tags['destroyed:tourism'] IS NOT NULL THEN 'tourism' WHEN tags['destroyed:leisure'] IS NOT NULL THEN 'leisure' WHEN tags['destroyed:man_made'] IS NOT NULL THEN 'man made' WHEN tags['destroyed:barrier'] IS NOT NULL THEN 'barrier' WHEN tags['destroyed:landuse'] IS NOT NULL THEN 'land use' WHEN tags['destroyed:natural'] IS NOT NULL THEN 'natural' ELSE 'other' END AS feature_type"
        - tags['damage:type'] AS damage_type
        - tags['damage:event'] AS damage_event
        - tags['damage:date'] AS damage_date
        - tags['end_date'] AS end_date
        - tags['was:building:levels'] AS was_building_levels
        - tags['destroyed:building'] AS destroyed_building
        - tags['destroyed:highway'] AS destroyed_highway
        - tags['destroyed:bridge'] AS destroyed_bridge
        - tags['destroyed:waterway'] AS destroyed_waterway
        - tags['destroyed:amenity'] AS destroyed_amenity
        - tags['damaged:building'] AS damaged_building
        - tags['source'] AS source
      where: []
    overture:
      enabled: false
      tiles: false

    transliterate:
      - target: name_latin
        source: name
        prefer: name_en

  - name: roads
    boundary_resolution: h3_neighbor
    hdx:
      title: Roads
      summary: Motorways, residential streets, service roads, tracks, footways and trails, with surface and width where recorded.
      notes: |
        Road network across the region tagged `highway=*`: motorways, residential streets, service roads, footways, and trails. Useful for routing, accessibility analysis, and evacuation planning.

        Coverage reflects where volunteer mappers have been active. Urban areas are usually well represented, remote areas may be sparse. Cross-check critical decisions with local field knowledge.

        - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative world map
        - Tags: [highway](https://wiki.openstreetmap.org/wiki/Key:highway)
        - Part of the [exports grid on HDX](https://data.humdata.org/organization/hot/) by [HOT](https://www.hotosm.org/)
      tags: [geodata, roads, transportation]
      license: hdx-odc-odbl
      license_url: https://opendatacommons.org/licenses/odbl/1-0/
      caveats: OpenStreetMap data is crowd sourced and cannot be considered to be exhaustive
      dataset_source: OpenStreetMap contributors
    osm:
      enabled: true
      filter:
        highway: true
        destroyed:highway: true
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['name:en'] AS name_en
        - *status
        - "coalesce(tags['highway'], tags['destroyed:highway']) AS highway"
        - tags['surface'] AS surface
        - tags['smoothness'] AS smoothness
        - tags['width'] AS width
        - tags['lanes'] AS lanes
        - tags['oneway'] AS oneway
        - tags['bridge'] AS bridge
        - tags['layer'] AS layer
        - tags['source'] AS source
      where: []
    overture:
      enabled: false
      tiles: false
    temporal:
      column: update_time

    transliterate:
      - target: name_latin
        source: name
        prefer: name_en

  - name: waterways
    formats: [gpkg, shp, geojson, kml]
    boundary_resolution: h3_neighbor
    hdx:
      title: Waterways
      summary: Rivers, streams, canals, lakes, ponds and wetlands.
      notes: |
        Water features across the region: rivers, streams, canals, lakes, ponds, and water bodies tagged with `waterway`, `water`, or `natural=water`. Useful for flood-risk modelling, watershed analysis, and environmental basemap context.

        Coverage reflects where volunteer mappers have been active. Urban areas are usually well represented, remote areas may be sparse. Cross-check critical decisions with local field knowledge.

        - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative world map
        - Tags: [waterway](https://wiki.openstreetmap.org/wiki/Key:waterway), [water](https://wiki.openstreetmap.org/wiki/Key:water), [natural](https://wiki.openstreetmap.org/wiki/Key:natural)
        - Part of the [exports grid on HDX](https://data.humdata.org/organization/hot/) by [HOT](https://www.hotosm.org/)
      tags: [geodata, hydrology, rivers]
      license: hdx-odc-odbl
      license_url: https://opendatacommons.org/licenses/odbl/1-0/
      caveats: OpenStreetMap data is crowd sourced and cannot be considered to be exhaustive
      dataset_source: OpenStreetMap contributors
    osm:
      enabled: true
      filter:
        waterway: true
        water: true
        natural: [water, wetland, bay]
        destroyed:waterway: true
        destroyed:natural: [water, wetland, bay]
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['name:en'] AS name_en
        - *status
        - "coalesce(tags['waterway'], tags['destroyed:waterway']) AS waterway"
        - tags['covered'] AS covered
        - tags['width'] AS width
        - tags['depth'] AS depth
        - tags['layer'] AS layer
        - tags['blockage'] AS blockage
        - tags['tunnel'] AS tunnel
        - "coalesce(tags['natural'], tags['destroyed:natural']) AS natural_class"
        - tags['water'] AS water
        - tags['source'] AS source
      where: []
    overture:
      enabled: false
      tiles: false
    temporal:
      column: update_time

    transliterate:
      - target: name_latin
        source: name
        prefer: name_en

  - name: railways
    formats: [gpkg, shp, geojson, kml]
    hdx:
      title: Railways
      summary: Rail lines, tram tracks and stations.
      notes: |
        Railway lines and stations tagged `railway=*`: rail lines, tram tracks, and stations. Useful for transport accessibility analysis and basemap context.

        Coverage reflects where volunteer mappers have been active. Urban areas are usually well represented, remote areas may be sparse. Cross-check critical decisions with local field knowledge.

        - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative world map
        - Tags: [railway](https://wiki.openstreetmap.org/wiki/Key:railway)
        - Part of the [exports grid on HDX](https://data.humdata.org/organization/hot/) by [HOT](https://www.hotosm.org/)
      tags: [facilities-infrastructure, geodata, railways, transportation]
      license: hdx-odc-odbl
      license_url: https://opendatacommons.org/licenses/odbl/1-0/
      caveats: OpenStreetMap data is crowd sourced and cannot be considered to be exhaustive
      dataset_source: OpenStreetMap contributors
    osm:
      enabled: true
      filter:
        railway: [rail, station]
        destroyed:railway: [rail, station]
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['name:en'] AS name_en
        - *status
        - "coalesce(tags['railway'], tags['destroyed:railway']) AS railway"
        - tags['ele'] AS ele
        - tags['operator:type'] AS operator_type
        - tags['layer'] AS layer
        - tags['addr:full'] AS addr_full
        - tags['addr:city'] AS addr_city
        - tags['source'] AS source
      where: []
    overture:
      enabled: false
    temporal:
      column: update_time

    transliterate:
      - target: name_latin
        source: name
        prefer: name_en

  - name: bridges
    formats: [gpkg, shp, geojson, kml]
    hdx:
      title: Bridges
      summary: Road, track, footway and aqueduct crossings, with the road class each one carries.
      notes: |
        Bridges tagged `bridge=*` or `man_made=bridge`: road, track, footway and aqueduct crossings, together with the road class each one carries. River crossings are the assets a flood removes first, and losing one can isolate settlements upstream, so this layer is separated from the road network for faster access analysis.

        Coverage reflects where volunteer mappers have been active. Urban areas are usually well represented, remote areas may be sparse. Cross-check critical decisions with local field knowledge.

        - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative world map
        - Tags: [bridge](https://wiki.openstreetmap.org/wiki/Key:bridge), [man_made=bridge](https://wiki.openstreetmap.org/wiki/Tag:man_made%3Dbridge)
        - Part of the [exports grid on HDX](https://data.humdata.org/organization/hot/) by [HOT](https://www.hotosm.org/)
      tags: [facilities-infrastructure, geodata, logistics, roads, transportation]
      license: hdx-odc-odbl
      license_url: https://opendatacommons.org/licenses/odbl/1-0/
      caveats: OpenStreetMap data is crowd sourced and cannot be considered to be exhaustive
      dataset_source: OpenStreetMap contributors
    osm:
      enabled: true
      filter:
        bridge: true
        man_made: [bridge]
        destroyed:bridge: true
        destroyed:man_made: [bridge]
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['name:en'] AS name_en
        - *status
        - "coalesce(tags['bridge'], tags['destroyed:bridge']) AS bridge"
        - tags['bridge:structure'] AS bridge_structure
        - tags['highway'] AS highway
        - tags['railway'] AS railway
        - tags['waterway'] AS waterway
        - "coalesce(tags['man_made'], tags['destroyed:man_made']) AS man_made"
        - tags['layer'] AS layer
        - tags['width'] AS width
        - tags['maxweight'] AS maxweight
        - tags['source'] AS source
      where: []
    overture:
      enabled: false
      tiles: false
    temporal:
      column: update_time

    transliterate:
      - target: name_latin
        source: name
        prefer: name_en

  - name: education_facilities
    formats: [gpkg, shp, geojson, kml]
    hdx:
      title: Education Facilities
      summary: Schools, kindergartens, colleges and universities.
      notes: |
        Education facilities: schools, kindergartens, colleges, and universities tagged via `amenity` or `building`. Useful for school-access mapping, education planning, and resource allocation.

        Coverage reflects where volunteer mappers have been active. Urban areas are usually well represented, remote areas may be sparse. Cross-check critical decisions with local field knowledge.

        - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative world map
        - Tags: [amenity](https://wiki.openstreetmap.org/wiki/Key:amenity), [building](https://wiki.openstreetmap.org/wiki/Key:building)
        - Part of the [exports grid on HDX](https://data.humdata.org/organization/hot/) by [HOT](https://www.hotosm.org/)
      tags: [education facilities-schools, geodata]
      license: hdx-odc-odbl
      license_url: https://opendatacommons.org/licenses/odbl/1-0/
      caveats: OpenStreetMap data is crowd sourced and cannot be considered to be exhaustive
      dataset_source: OpenStreetMap contributors
    osm:
      enabled: true
      filter:
        amenity: [kindergarten, school, college, university]
        building: [kindergarten, school, college, university]
        destroyed:amenity: [kindergarten, school, college, university]
        destroyed:building: [kindergarten, school, college, university]
        damaged:building: [kindergarten, school, college, university]
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['name:en'] AS name_en
        - *status
        - "coalesce(tags['amenity'], tags['destroyed:amenity']) AS amenity"
        - "coalesce(tags['building'], tags['destroyed:building'], tags['damaged:building'], tags['damage:building']) AS building"
        - tags['operator:type'] AS operator_type
        - tags['capacity:persons'] AS capacity_persons
        - tags['addr:full'] AS addr_full
        - tags['addr:city'] AS addr_city
        - tags['source'] AS source
      where: []
    overture:
      enabled: true
      theme: places
      feature_type: place
      select:
        - id
        - names.primary AS name
        - names.common->>'en' AS name_en
        - taxonomy.primary AS category
        - addresses[1].freeform AS address
        - phones[1] AS phone
        - websites[1] AS website
        - confidence
        - sources[1].dataset AS source
      where:
        - "list_has_any(taxonomy.hierarchy, ['school', 'college_university']) OR taxonomy.primary IN ('education', 'educational_service')"
    temporal:
      column: update_time

    transliterate:
      - target: name_latin
        source: name
        prefer: name_en

  - name: health_facilities
