        - tags['name'] AS name
        - tags['name:en'] AS name_en
        - *status
        - "coalesce(tags['amenity'], tags['destroyed:amenity']) AS amenity"
        - tags['operator'] AS operator
        - tags['network'] AS network
        - tags['addr:full'] AS addr_full
        - tags['addr:city'] AS addr_city
        - tags['source'] AS source
      where: []
    overture:
      enabled: false
    temporal:
      column: update_time

    transliterate:
      - target: name_latin
        source: name
        prefer: name_en

  - name: sea_ports
    formats: [gpkg, shp, geojson, kml]
    hdx:
      title: Sea Ports
      summary: Ports and ferry terminals.
      notes: |
        Sea ports and ferry terminals tagged via `amenity`, `building`, or `port`. Useful for maritime logistics, supply-chain analysis, and coastal access planning.

