  - name: helipads
    formats: [gpkg, shp, geojson, kml]
    hdx:
      title: Helipads
      summary: Helicopter landing points, including those attached to hospitals and other facilities.
      notes: |
        Helicopter landing points tagged `aeroway=helipad`, `aeroway=heliport`, `emergency:helipad=*` or `emergency=landing_site`, including helipads attached to hospitals and other facilities. Where a flood has washed out road bridges, helicopter access becomes the route for evacuation and relief, so landing points are separated from the airports layer to make them directly usable.

        Coverage reflects where volunteer mappers have been active. A helipad recorded here is a mapped location, not a certified or currently serviceable landing site; confirm surface, obstructions, approach and ownership locally before planning an operation.

        - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative world map
        - Tags: [aeroway=helipad](https://wiki.openstreetmap.org/wiki/Tag:aeroway%3Dhelipad), [emergency:helipad](https://wiki.openstreetmap.org/wiki/Key:emergency)
