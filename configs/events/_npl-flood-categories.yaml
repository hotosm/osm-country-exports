      license: hdx-odc-odbl
      license_url: https://opendatacommons.org/licenses/odbl/1-0/
      caveats: OpenStreetMap data is crowd sourced and cannot be considered to be exhaustive
      dataset_source: OpenStreetMap contributors
    osm:
      enabled: true
      filter:
        healthcare: true
        amenity: [doctors, dentist, clinic, hospital, pharmacy]
        destroyed:amenity: [doctors, dentist, clinic, hospital, pharmacy]
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['name:en'] AS name_en
        - *status
        - "coalesce(tags['amenity'], tags['destroyed:amenity']) AS amenity"
        - tags['building'] AS building
        - tags['healthcare'] AS healthcare
        - tags['healthcare:speciality'] AS healthcare_speciality
        - tags['operator:type'] AS operator_type
        - tags['capacity:persons'] AS capacity_persons
        - tags['addr:full'] AS addr_full
        - tags['addr:city'] AS addr_city
        - tags['source'] AS source
      where: []
    overture:
      enabled: true
      theme: places
      feature_type: place
      select:
        - id
        - names.primary AS name
        - names.common->>'en' AS name_en
        - taxonomy.primary AS category
        - addresses[1].freeform AS address
        - phones[1] AS phone
        - websites[1] AS website
        - confidence
        - sources[1].dataset AS source
      where:
        - "list_has_any(taxonomy.hierarchy, ['hospital', 'outpatient_care_facility', 'emergency_or_urgent_care_facility', 'pharmacy_and_drug_store', 'blood_and_plasma_donation_center']) OR taxonomy.primary = 'health_care'"
    temporal:
      column: update_time

    transliterate:
      - target: name_latin
        source: name
        prefer: name_en

  - name: populated_places
