    hdx:
      title: Open Spaces
      summary: Parks, pitches, playgrounds, recreation grounds, commons, village greens, marketplaces and camp sites, the open ground that can host shelter or relief staging.
      notes: |
        Open ground that could host temporary shelter, evacuation assembly or relief staging: parks, pitches, playgrounds, recreation grounds, commons, village greens, marketplaces, camp sites and managed grass. Flood response needs candidate sites on dry, unbuilt ground, and this layer separates them from the general land use picture.

        Coverage reflects where volunteer mappers have been active. Open space is among the least consistently mapped feature types, so an empty or sparse result indicates a mapping gap rather than an absence of usable ground. Cross-check every candidate site with local field knowledge before use; suitability depends on ownership, access, drainage and elevation, none of which are recorded here.

