      notes: |
        Named cities, towns, villages, suburbs, hamlets and isolated dwellings, as points. Useful for demographic context, settlement-level targeting and population analysis. Residential land itself is a separate layer.

        Coverage reflects where volunteer mappers have been active. Urban areas are usually well represented, remote areas may be sparse. Cross-check critical decisions with local field knowledge.

        - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative world map
        - Tags: [place](https://wiki.openstreetmap.org/wiki/Key:place)
        - Part of the [exports grid on HDX](https://data.humdata.org/organization/hot/) by [HOT](https://www.hotosm.org/)
      tags: [geodata, populated places-settlements]
      license: hdx-odc-odbl
      license_url: https://opendatacommons.org/licenses/odbl/1-0/
      caveats: OpenStreetMap data is crowd sourced and cannot be considered to be exhaustive
      dataset_source: OpenStreetMap contributors
    osm:
      enabled: true
      filter:
        place: [isolated_dwelling, town, village, hamlet, city]
      select:
        - feature_id AS id
        - tags['name'] AS name
        - tags['name:en'] AS name_en
        - *status
        - tags['place'] AS place
        - tags['population'] AS population
        - tags['is_in'] AS is_in
        - tags['source'] AS source
      where: []
    overture:
      enabled: false
      tiles: false
    temporal:
      column: update_time

    transliterate:
      - target: name_latin
        source: name
        prefer: name_en

  - name: residential_areas
    formats: [gpkg, shp, geojson, kml]
    boundary_resolution: h3_neighbor
    hdx:
      title: Residential Areas
      summary: Land given over to housing, drawn around clusters of buildings as villages, neighbourhoods and settlement footprints.
      notes: |
        Land predominantly given over to housing, drawn around clusters of buildings. Volunteers map these during the response so that settlements have a footprint even where individual buildings are not yet traced, which makes them useful for locating population when building coverage is thin.

        - Source: [OpenStreetMap](https://www.openstreetmap.org), a free, collaborative world map
        - Tags: [landuse=residential](https://wiki.openstreetmap.org/wiki/Tag:landuse%3Dresidential)
        - Part of the [exports grid on HDX](https://data.humdata.org/organization/hot/) by [HOT](https://www.hotosm.org/)
