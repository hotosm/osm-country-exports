[project]
name = "hotosm-country-exports"
version = "0.0.1"
description = "HOT OSM country-scale HDX exports."
requires-python = ">=3.11"
dependencies = [
    "hdx-python-api>=6.6.7",
    # 0.4.16 adds the STAC catalog and report settings configs/base.yaml uses.
    "oex>=0.4.16",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.2",
    "quackosm",
    "universal-pathlib>=0.3.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.13",
    "ty>=0.0.78",
]
docs = [
    "zensical>=0.0.71",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "scripts"]

[tool.ruff.lint]
extend-select = ["I", "E501"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]

[tool.ty.environment]
# The scripts import one another by module name, as pytest's pythonpath does for the tests.
extra-paths = ["scripts"]

[tool.uv]
package = false

[tool.uv.sources]
quackosm = { git = "https://github.com/kshitijrajsharma/quackosm", rev = "68f808195b47c0d928a4fdd0fda6715f390a6d6f" }

