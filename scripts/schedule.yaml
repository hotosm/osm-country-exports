# What runs, and when. Priority is the HDX Data Grid locations; high-income countries
# refresh quarterly and the largest countries yearly.
#
# groups:  run order. Position in the list is priority.
#
# A group sets one frequency for everything in it, and holds one job source:
#   countries:  a list of ISO3 codes. Config is configs/countries/<ISO3>.yaml merged
#               over configs/base.yaml, or configs/base.yaml alone.
#   dir:        a folder of standalone configs, one job per file. Each config's own
#               `frequency:` wins over the group's.
#   workers:    country exports at once in this group (default 1). Each gets an equal
#               share of the memory.
#
# One country can still differ from its group: write the countries as a mapping, for
# example {PAK: weekly, NPL: null}, or {SDN: {expires: 2026-12-31}}.
#
# `sweep.py --due` runs every job whose last success is older than its frequency.
# `frequency: as needed` never runs on a schedule; run those by hand with
# --frequency "as needed". An expired or disabled job is skipped and says so.

groups: [priority, normal, high_income, big, minimal, events, tasking_manager, tasking_manager_sandbox]

# Data Grid locations (22).
priority:
  enabled: true
  frequency: monthly
  countries: [
    AFG, BFA, CAF, CMR, COD, COL, HTI, LBN, MLI, MMR, MOZ, NER, NGA, PSE, SDN, SOM, SSD,
    SYR, TCD, UKR, VEN, YEM
  ]

# Every other country HDX refreshes monthly (109).
normal:
  enabled: true
  frequency: monthly
  workers: 2
  countries: [
    AGO, ALB, ARM, AZE, BDI, BEN, BGD, BIH, BLR, BLZ, BOL, BTN, BWA, CIV, COG, COK, COM,
    CPV, CUB, DJI, DMA, DOM, ECU, EGY, ERI, ESH, ETH, FJI, FSM, GAB, GEO, GHA, GIN, GMB,
    GNB, GNQ, GRD, GTM, HND, IRN, IRQ, JAM, JOR, KEN, KGZ, KHM, KIR, LAO, LBR, LBY, LCA,
    LKA, LSO, MAR, MDA, MDG, MDV, MHL, MKD, MNE, MNG, MRT, MUS, MWI, MYS, NAM, NIC, NIU,
    NPL, NRU, PAK, PER, PHL, PLW, PNG, PRK, PRY, RWA, SEN, SHN, SLB, SLE, SLV, SRB, STP,
    SUR, SWZ, TGO, THA, TJK, TKL, TKM, TLS, TON, TUN, TUR, TUV, TZA, UGA, UZB, VCT, VNM,
    VUT, WLF, WSM, XKX, ZAF, ZMB, ZWE
  ]

# High-income countries (95).
high_income:
  enabled: true
  frequency: quarterly
  countries: [
    ABW, AIA, ALA, AND, ARE, ASM, ATG, AUT, BEL, BES, BGR, BHR, BHS, BLM, BMU, BRB, BRN,
    CHE, CHL, CRI, CUW, CYM, CYP, CZE, DEU, DNK, ESP, EST, FIN, FLK, FRA, FRO, GBR, GGY,
    GIB, GLP, GRC, GRL, GUF, GUM, GUY, HKG, HRV, HUN, IMN, IRL, ISL, ISR, ITA, JEY, JPN,
    KNA, KOR, KWT, LIE, LTU, LUX, LVA, MAC, MAF, MCO, MLT, MNP, MSR, MTQ, MYT, NCL, NLD,
    NOR, NZL, OMN, PAN, POL, PRI, PRT, PYF, QAT, REU, ROU, SAU, SGP, SMR, SPM, SVK, SVN,
    SWE, SXM, SYC, TCA, TTO, TWN, URY, VAT, VGB, VIR
  ]

# The largest countries (12).
big:
  enabled: true
  frequency: yearly
  countries: [
    ARG, AUS, BRA, CAN, CHN, DZA, IDN, IND, KAZ, MEX, RUS, USA
  ]

# Uninhabited or nearly empty territories (12); off the schedule.
minimal:
  enabled: true
  frequency: as needed
  countries: [
    ATA, ATF, BVT, CCK, CXR, HMD, IOT, NFK, PCN, SGS, SJM, UMI
  ]

events:
  enabled: true
  dir: configs/events
  frequency: monthly
  # Per-file overrides, keyed by filename. A frequency here only decides when the job
  # runs; what HDX advertises comes from the config's own `frequency:`.
  overrides:
    # VEN-EQ-2026-000093.yaml: {frequency: daily, expires: 2026-09-30}
    # VEN-EQ-2026-000093-osm.yaml: {enabled: false}

# Tasking Manager projects. Both dirs are filled by scripts/tm_configs.py before
# the sweep runs; the configs themselves are generated, not committed.

tasking_manager:
  enabled: true
  dir: configs/tasking_manager
  frequency: daily

tasking_manager_sandbox:
  enabled: true
  dir: configs/tasking_manager_sandbox
  frequency: daily
