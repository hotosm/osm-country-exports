# What runs, and when.
#
# groups:  run order. Position in the list is priority.
#
# A group holds one job source:
#   countries:  ISO3 -> frequency. Config is configs/countries/<ISO3>.yaml merged
#               over configs/base.yaml, or configs/base.yaml alone.
#   dir:        a folder of standalone configs, one job per file. Frequency comes
#               from each config's own `frequency:` field, falling back to the
#               group's `frequency:`.
#
# Any value is either a bare frequency or a mapping of frequency / enabled / expires:
#   AFG: monthly
#   YEM: {frequency: monthly, enabled: false}
#   SDN: {frequency: monthly, expires: 2026-12-31}
#
# `frequency: as needed` never runs on a schedule. Run those by hand with
# --frequency "as needed". An expired or disabled job is skipped and says so.

groups: [priority, normal, heavy, events, tasking_manager, tasking_manager_sandbox]

